name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: heritagex
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d heritagex"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heritagex?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/heritagex?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-change-for-tests-only-123456
      JWT_REFRESH_SECRET: ci-refresh-secret-change-for-tests-only-654321
      ADMIN_EMAIL: admin@example.test
      ADMIN_PASSWORD: ChangeThisTestOnly123
      CORS_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:deploy
      - run: npm run prisma:seed
      - run: npm run build
      - run: npm test

  frontend-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
