<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Heritage Sites | HeritageX Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
</head>

<body class="admin-body">

    <div id="adminGate" style="display:none;">
        <div class="admin-sidebar-backdrop" id="sidebarBackdrop"></div>
        <div class="admin-shell">

            <aside class="admin-sidebar" id="adminSidebar">
                <div class="brand">
                    <span class="mark"><i class="bi bi-bank2"></i></span> HeritageX Admin
                    <button class="sidebar-close-btn" id="sidebarCloseBtn" aria-label="Close menu"><i
                            class="bi bi-x-lg"></i></button>
                </div>
                <nav>
                    <a class="admin-nav-link" href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
                    <a class="admin-nav-link active" href="sites.html"><i class="bi bi-bank"></i> Heritage Sites</a>
                    <a class="admin-nav-link" href="reviews.html"><i class="bi bi-chat-square-text"></i> Reviews</a>
                    <a class="admin-nav-link" href="analytics.html"><i class="bi bi-bar-chart"></i> Analytics</a>
                </nav>
                <div class="sidebar-footer">
                    <button class="admin-nav-link w-100 border-0 bg-transparent text-start" id="logoutBtn">
                        <i class="bi bi-box-arrow-right"></i> Logout
                    </button>
                </div>
            </aside>

            <div class="admin-main">
                <header class="admin-topbar">
                    <div class="topbar-left">
                        <h1>Heritage Sites</h1>
                    </div>
                    <div class="admin-user">
                        <span class="avatar">A</span>
                        <span>Administrator</span>
                    </div>
                    <button class="btn btn-outline-secondary" id="sidebarToggle" aria-label="Open menu"
                        aria-expanded="false"><i class="bi bi-list"></i></button>
                </header>

                <main class="admin-content">
                    <div class="row g-3 mb-4">
                        <div class="col-6 col-lg-3">
                            <div class="admin-stat-card text-center">
                                <div class="num" id="statTotal">0</div>
                                <div class="label">Total sites</div>
                            </div>
                        </div>
                        <div class="col-6 col-lg-3">
                            <div class="admin-stat-card text-center">
                                <div class="num" id="statVerified">0</div>
                                <div class="label">Verified sites</div>
                            </div>
                        </div>
                        <div class="col-6 col-lg-3">
                            <div class="admin-stat-card text-center">
                                <div class="num" id="statPending">0</div>
                                <div class="label">Pending reviews</div>
                            </div>
                        </div>
                        <div class="col-6 col-lg-3">
                            <div class="admin-stat-card text-center">
                                <div class="num" id="statCategories">0</div>
                                <div class="label">Categories</div>
                            </div>
                        </div>
                    </div>

                    <div class="admin-panel-card p-3 p-lg-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h2 class="h5 mb-0">Manage heritage sites</h2>
                            <button class="btn btn-admin-primary btn-sm" data-bs-toggle="modal"
                                data-bs-target="#siteModal" id="addSiteBtn"><i class="bi bi-plus-lg me-1"></i> Add
                                Heritage Site</button>
                        </div>
                        <div class="table-responsive">
                            <table class="table align-middle">
                                <thead>
                                    <tr>
                                        <th>Name</th>
                                        <th>Category</th>
                                        <th>Rating</th>
                                        <th>Status</th>
                                        <th class="text-end">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="sitesTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </main>
            </div>
        </div>
    </div>

    <!-- ADD/EDIT SITE MODAL -->
    <div class="modal fade" id="siteModal" tabindex="-1" aria-labelledby="siteModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="siteForm">
                    <div class="modal-header">
                        <h2 class="modal-title h5" id="siteModalLabel">Add Heritage Site</h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="siteFormId">
                        <div class="mb-2"><label class="form-label small">Name</label><input required id="siteFormName"
                                class="form-control"></div>
                        <div class="mb-2"><label class="form-label small">Category</label>
                            <select id="siteFormCategory" class="form-select"></select>
                        </div>
                        <div class="mb-2"><label class="form-label small">Short description</label><textarea
                                id="siteFormDesc" class="form-control" rows="2" required></textarea></div>
                        <div class="mb-2"><label class="form-label small">Verification status</label>
                            <select id="siteFormVerified" class="form-select">
                                <option value="true">Verified</option>
                                <option value="false">Pending verification</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-admin-primary">Save site</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/main.js"></script>
    <script src="js/admin-auth.js"></script>
    <script src="js/admin.js"></script>
    <script>
        if (protectAdminPage()) {
            document.getElementById("adminGate").style.display = "";
        }
    </script>
</body>

</html>
